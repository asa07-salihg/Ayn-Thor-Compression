name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going cancels it: the older
# result is about code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy || true   # advisory: PySide6's stubs contradict themselves often enough

  test:
    # The engine never imports Qt, which is the point of keeping core/ free of
    # it: this runs with no display server and no PySide6 installed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install pytest pytest-cov zstandard
      - run: pytest --cov=aynthor --cov-report=term-missing --ignore=tests/test_ui_smoke.py

  ui:
    # Builds every window on the offscreen platform and checks it rendered.
    # A settings page once shipped blank: the widgets were all correct and all
    # invisible, and only rendering catches that.
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libdbus-1-3 libfontconfig1
      - run: pip install pytest zstandard PySide6
      - run: pytest tests/test_ui_smoke.py -v

  build:
    # Proves the PyInstaller spec still works before a tag depends on it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install . pyinstaller
      - run: python packaging/build_exe.py --allow-missing-tools
      - uses: actions/upload-artifact@v7
        with:
          name: AynThorCompression-untested-build
          path: dist/AynThorCompression.exe
          retention-days: 7
