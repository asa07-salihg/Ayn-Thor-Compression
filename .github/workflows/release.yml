name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install . pyinstaller

      # Every tool is verified against the SHA-256 in
      # src/aynthor/core/tools/manifest.py before it is written to disk, so a
      # release exe can never be built around a tool that changed upstream.
      - name: Fetch and verify converter tools
        run: python scripts/fetch_tools.py

      # This also writes dist/SHA256SUMS.txt. The updater refuses a release
      # that has no checksum file and verifies the download against it, so the
      # same step has to produce both.
      - name: Build
        run: python packaging/build_exe.py

      - name: Show what will be published
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt

      # Body = the matching ## section in CHANGELOG.md (v1.6.0 -> ## 1.6.0).
      - name: Write release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $out = [System.Collections.Generic.List[string]]::new()
          $capture = $false
          foreach ($line in $lines) {
            if ($line -match "^##\s+$([regex]::Escape($ver))\b") {
              $capture = $true
              continue
            }
            if ($capture -and $line -match '^##\s+') { break }
            if ($capture) { [void]$out.Add($line) }
          }
          if ($out.Count -eq 0) {
            throw "No CHANGELOG.md section for version $ver (tag $tag)"
          }
          $body = @(
            "## $ver"
            ""
          ) + $out.ToArray() + @(
            ""
            "[Full changelog](https://github.com/asa07-salihg/Ayn-Thor-Compression/blob/main/CHANGELOG.md)"
          )
          Set-Content -Path release-notes.md -Value ($body -join "`n") -Encoding utf8
          Get-Content release-notes.md

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AynThorCompression.exe
            dist/SHA256SUMS.txt
          body_path: release-notes.md
          generate_release_notes: false
